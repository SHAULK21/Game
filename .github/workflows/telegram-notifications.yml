name: Telegram scheduled notifications
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-notification-drain
  cancel-in-progress: false
jobs:
  drain:
    if: vars.TELEGRAM_NOTIFICATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:telegram
      - name: Deliver committed Telegram notifications
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: node scripts/drain-telegram-notifications.mjs
