name: Android APK test (emulator)

# Builds the app, starts it on an Android emulator and saves screenshots + crash log
# to the `apk-test` branch (apk-test/<run>/), so the app can be checked without a phone.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APK_VERSION_CODE: 9999
      APK_VERSION_NAME: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build (debug key)
        run: gradle -p android :app:assembleRelease --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/test/emulator-smoke.sh android/app/build/outputs/apk/release/app-release.apk out
      - name: Save results to the apk-test branch
        if: always()
        run: |
          mkdir -p out && cd out
          git init -q && git checkout -q -b apk-test
          git config user.name "apk-test" && git config user.email "apk-test@users.noreply.github.com"
          mkdir -p "${{ github.run_number }}" && find . -maxdepth 1 -type f -exec mv {} "${{ github.run_number }}/" \;
          git add -A && git commit -qm "APK emulator test ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-test
