name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  postgres-progress:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: game_test
          POSTGRES_PASSWORD: game_test
          POSTGRES_DB: game_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U game_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm ci
      - name: Progress integration with independent PostgreSQL connections
        env:
          TEST_DATABASE_URL: postgres://game_test:game_test@localhost:5432/game_test
        run: node --import tsx --test tests/server-progress.test.ts tests/server-progress-ui.test.ts
