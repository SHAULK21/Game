name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
