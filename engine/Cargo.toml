[package]
name = "aethelgard-engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
sha2 = { version = "=0.10.9", optional = true, default-features = false }

[features]
actor-hash = ["dep:sha2"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
